name: Build Erses Health Bridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'health-bridge/**'
      - '.github/workflows/health-bridge-debug.yml'
  pull_request:
    paths:
      - 'health-bridge/**'
      - '.github/workflows/health-bridge-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p health-bridge assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erses-health-bridge-debug-apk
          path: health-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
